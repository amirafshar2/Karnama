# Render blueprint for the DEMO install (sample data, one-click role login) — never for a real agency.
# Two free web services in Frankfurt. The API image carries its own PostgreSQL (src/Karnama.Api/Dockerfile.demo), so no
# separate database is needed and every restart is a fresh demo. Guide (Persian): deploy/RENDER.md
# Secrets are generated by Render (generateValue) and never live in the repository.

services:
  # ASP.NET Core API + its own PostgreSQL (also used directly by the Android app).
  - type: web
    name: karnama-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./src/Karnama.Api/Dockerfile.demo
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Demo
      - key: PORT
        value: "8080"
      - key: Seed__Mode
        value: Demo
      - key: DemoLogin__Enabled
        value: "true"
      - key: Database__AutoMigrate
        value: "true"
      - key: Jwt__SigningKey
        generateValue: true
      - key: Otp__HashKey
        generateValue: true
      - key: Setup__Token
        generateValue: true
      - key: Vault__MasterKey
        generateValue: true       # base64 of 32 random bytes
      - key: Storage__LocalPath
        value: /tmp/karnama-storage   # free plan has no disk: uploads disappear on restart
      # The Android app (Capacitor, origin https://localhost) calls the API directly.
      - key: Cors__AllowedOrigins__0
        value: https://localhost
      # The site's own address (e.g. https://karnama-web.onrender.com): live updates connect from it straight to the API.
      - key: Cors__AllowedOrigins__1
        sync: false
      # Every browser request reaches the API through the site's proxy, so they share one address: generous limits.
      - key: RateLimits__AuthPerIpPerMinute
        value: "300"
      - key: RateLimits__RefreshPerIpPerMinute
        value: "600"
      - key: RateLimits__FormsPerIpPer10Minutes
        value: "200"
      - key: RateLimits__OtpPerIpPer10Minutes
        value: "50"

  # Next.js website + panel. /api and /hubs are proxied to the API so the sign-in cookie stays on one site.
  - type: web
    name: karnama-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./src/karnama-web/Dockerfile
    dockerContext: ./src/karnama-web
    envVars:
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_BASE
        value: "/"                # same origin: the browser calls /api on the site itself
      - key: NEXT_PUBLIC_HUB_BASE
        sync: false               # the API's address again: live updates (WebSocket) go straight to the API
                                  # (a token, not the cookie, so a second host is fine; needs Cors__AllowedOrigins__1 on the API)
      - key: NEXT_PUBLIC_APK_URL
        value: https://github.com/amirafshar2/Karnama/releases/download/android-latest/karnama.apk   # built by .github/workflows/android.yml
      - key: API_PROXY_TARGET
        sync: false               # the API's address, e.g. https://karnama-api.onrender.com (asked when you create the blueprint)
      - key: API_INTERNAL_BASE
        sync: false               # the same address again (the server-rendered public pages read the API with it)
