# Build, test and supply-chain checks on every push / PR. A vulnerable package = red build.
# Actions are pinned to commit SHAs (security skill 7: gha-security-review).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karnama
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U karnama" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      KARNAMA_TEST_PG: Host=localhost;Username=karnama;Password=ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Karnama.sln
      - name: Vulnerable packages (fail on any)
        run: |
          dotnet list Karnama.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE "has the following vulnerable packages" vuln.txt; then echo "::error::Vulnerable NuGet packages"; exit 1; fi
      - run: dotnet build Karnama.sln -c Release --no-restore
      - run: dotnet test Karnama.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/karnama-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/karnama-web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Bandwidth budget (first page < 200 KB, panels < 180 KB gzip)
        run: npm run size
      - name: Android static export builds
        run: npm run build:mobile
