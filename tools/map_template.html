<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نقشه‌ی پروژه — کارنما</title>
<style>
  :root { --bg:#f5f7f9; --card:#ffffff; --ink:#15202b; --muted:#5b6875; --line:#d6dde3; --accent:#0e8f9a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f171d; --card:#16222a; --ink:#e6edf1; --muted:#93a3ae; --line:#2a3a45; --accent:#3cc4ce; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.9 Vazirmatn, Tahoma, "Segoe UI", sans-serif; padding:24px max(16px, env(safe-area-inset-left)); }
  main { max-width:1080px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 28px; }
  h1 { margin-top:0; font-size:28px } h2 { border-bottom:2px solid var(--line); padding-bottom:6px; margin-top:36px }
  a { color:var(--accent) }
  blockquote { margin:0; padding:8px 16px; border-inline-start:4px solid var(--accent); color:var(--muted); background:var(--bg); border-radius:8px }
  .tbl { overflow-x:auto } table { border-collapse:collapse; width:100%; font-size:15px }
  th, td { border:1px solid var(--line); padding:6px 10px; text-align:start; vertical-align:top } th { background:var(--bg) }
  code { background:var(--bg); padding:1px 6px; border-radius:6px; direction:ltr; unicode-bidi:embed }
  pre { background:var(--bg); padding:12px; border-radius:8px; overflow-x:auto; direction:ltr; text-align:left }
  .mermaid { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin:12px 0; overflow-x:auto; direction:ltr; text-align:center }
  footer { color:var(--muted); font-size:13px; margin-top:24px }
</style>
</head>
<body>
<main id="content">در حال ساخت نقشه…</main>
<footer style="text-align:center">ساخته‌شده با tools/build_map.py — __BUILT_AT__</footer>
<script src="../tools/vendor/marked.min.js"></script>
<script src="../tools/vendor/mermaid.min.js"></script>
<script>
  const md = __MARKDOWN_JSON__;
  const el = document.getElementById('content');
  el.innerHTML = marked.parse(md);
  el.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });
  el.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });
  mermaid.initialize({ startOnLoad:false, theme:'default', securityLevel:'strict', fontFamily:'Vazirmatn, Tahoma, sans-serif' });
  mermaid.run({ querySelector:'.mermaid' });
</script>
</body>
</html>
